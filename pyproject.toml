[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zego-site-crawler"
version = "1.0.0"
description = "A concurrent, same-host website crawler for the Zego engineering exercise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3.0",
  "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "responses>=0.25,<1.0"]

[project.scripts]
site-crawler = "site_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
